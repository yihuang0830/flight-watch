# 监控航线，不限中转、不限时段
#   STL → LAS         12/16、12/17          目标价 120
#   首尔 → 三亚        12/19、12/20          目标价 120
#   上海 → 东京        12/16、12/17、12/18   目标价 150

defaults:
  currency: USD
  seat: economy
  passengers: 1
  keep_top: 8
  target_price: 120    # 报告里跌破这个价的航线打 🎯（只做标记，不单独推送）

  # 不做紧急推送：只在下面这几个时刻发报告。
  # urgent_price 留空即关闭该路径。
  urgent_price:

  report_timezone: America/Chicago
  report_times: ["09:00", "13:00", "16:30", "20:30", "23:30"]

watches:
  - name: STL-LAS
    from: STL
    to: LAS
    trip: one-way
    dates: [2026-12-16, 2026-12-17]

  # SEL 是首尔的城市代码，同时覆盖仁川(ICN)与金浦(GMP)。
  # 实测只写 ICN 会漏掉金浦出发的选项，写 SEL 由 Google 自动挑最优。
  - name: SEL-SYX
    from: SEL
    to: SYX
    trip: one-way
    dates: [2026-12-19, 2026-12-20]

  # 上海必须拆成两条：SHA 只代表虹桥机场，不是上海的城市代码
  # （实测 SHA→TYO 会绕道首尔金浦 $281，而 PVG→TYO 直飞仅 $148）。
  # TYO 则是有效的东京城市码，实测同时覆盖成田(NRT)与羽田(HND)。
  - name: PVG-TYO
    from: PVG
    to: TYO
    trip: one-way
    dates: [2026-12-16, 2026-12-17, 2026-12-18]
    target_price: 150

  - name: SHA-TYO
    from: SHA
    to: TYO
    trip: one-way
    dates: [2026-12-16, 2026-12-17, 2026-12-18]
    target_price: 150
