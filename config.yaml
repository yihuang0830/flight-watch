# 两条航线，不限中转、不限时段
#   STL → LAS        12/16、12/17
#   首尔 → 三亚       12/19、12/20

defaults:
  currency: USD
  seat: economy
  passengers: 1
  keep_top: 8
  target_price: 120    # 报告里跌破这个价的航线打 🎯
  urgent_price: 120    # 任何航线跌破这个价就推送
  urgent_repeat: true        # 每轮都报，不要求"比上次更便宜"
  urgent_cooldown_hours: 4   # 但同一条航线 4 小时内最多报一次
  quiet_hours: ["00:00", "08:00"]   # 免打扰（本地时间），夜里不推送

  report_timezone: America/Chicago
  report_times: ["09:00", "13:00", "16:30", "20:30", "23:30"]

watches:
  - name: STL-LAS
    from: STL
    to: LAS
    trip: one-way
    dates: [2026-12-16, 2026-12-17]

  # SEL 是首尔的城市代码，同时覆盖仁川(ICN)与金浦(GMP)。
  # 实测只写 ICN 会漏掉金浦出发的选项，写 SEL 由 Google 自动挑最优。
  - name: SEL-SYX
    from: SEL
    to: SYX
    trip: one-way
    dates: [2026-12-19, 2026-12-20]
