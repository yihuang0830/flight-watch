# 美国 → 东南亚，4 个出发地 × 5 个目的地 = 20 条航线
# 出发日: 12/16、12/17，不限时段、不限中转次数

defaults:
  currency: USD
  seat: economy
  passengers: 1
  keep_top: 8          # 每条航线每天最多存 8 档报价
  target_price: 810    # 跌破这个价就微信提醒（消息里会附上全部 20 条航线）
  # 刻意不设 max_stops：实测限制中转会让你错过更便宜的票

watches:
  # ---------- 拉斯维加斯 LAS ----------
  - name: LAS-SGN           # 拉斯维加斯 → 胡志明市
    from: LAS
    to: SGN
    trip: one-way
    dates: [2026-12-16, 2026-12-17]
  - name: LAS-HAN           # 拉斯维加斯 → 河内
    from: LAS
    to: HAN
    trip: one-way
    dates: [2026-12-16, 2026-12-17]
  - name: LAS-DAD           # 拉斯维加斯 → 岘港
