name: Flight Watch

on:
  # 每 30 分钟扫一次。用固定间隔而非定点时刻，是因为 GitHub cron 只认 UTC、
  # 不处理夏令时；「何时该发报告」交给代码用时区库判断（notify.due_report_slot），
  # 这样 11 月换冬令时不用改任何配置。
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 上一轮没跑完就别开新的，避免并发写同一个 flights.db
concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 数据库在轮次之间靠缓存传递，而不是每轮都提交进 git。
      # 每 30 分钟提交一次二进制库，实测一周就能让仓库涨到 4GB
      # （git 存的是整份快照，不是差异）。
      - name: 取回数据库
        uses: actions/cache/restore@v4
        with:
          path: flights.db
          key: flightdb-${{ github.run_id }}
          restore-keys: flightdb-

      - run: pip install -r requirements.txt

      - name: 抓取（跌破 800 立刻推送；到点发定时报告；其余静默）
        id: scan
        env:
          SERVERCHAN_SEND_KEY: ${{ secrets.SERVERCHAN_SEND_KEY }}
        run: python -m flightwatch watch

      - name: 保存数据库
        if: always()
        uses: actions/cache/save@v4
        with:
          path: flights.db
          key: flightdb-${{ github.run_id }}

      # 只有真发了消息的轮次才落 git —— 一天约 5 次，仓库增长可控。
      # 缓存万一被 LRU 清掉，也能从最近一次提交恢复。
      - name: 生成报告
        if: steps.scan.outputs.persist == 'yes'
        run: python -m flightwatch report --html docs/index.html

      - name: 提交数据
        if: steps.scan.outputs.persist == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights.db docs/index.html
          git diff --staged --quiet && exit 0
          git commit -m "flightwatch: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
