name: Flight Watch

on:
  # 主触发源：外部定时服务（cron-job.org）POST 到 repository_dispatch。
  #
  # 为什么不靠 GitHub 自己的 cron：实测 "*/30" 在 11.5 小时里只触发了 1 次。
  # GitHub 官方只承认"高峰期可能延迟"，实际上高频 schedule 会被大量丢弃，
  # 导致 09:00 的定时报告整个错过。外部服务触发则是准时的。
  repository_dispatch:
    types: [scan]

  # 保留作兜底：外部服务万一挂了，这里还能偶尔跑一跑。
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

# 上一轮没跑完就别开新的，避免并发写同一个 flights.db
concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 兜底：卡住的轮次不能占着并发槽阻塞后续
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 数据库在轮次之间靠缓存传递，而不是每轮都提交进 git。
      # 每 30 分钟提交一次二进制库，实测一周就能让仓库涨到 4GB
      # （git 存的是整份快照，不是差异）。
      - name: 取回数据库
        uses: actions/cache/restore@v4
        with:
          path: flights.db
          key: flightdb-${{ github.run_id }}
          restore-keys: flightdb-

      - run: pip install -r requirements.txt

      - name: 抓取（跌破 800 立刻推送；到点发定时报告；其余静默）
        id: scan
        env:
          SERVERCHAN_SEND_KEY: ${{ secrets.SERVERCHAN_SEND_KEY }}
        run: python -m flightwatch watch

      - name: 保存数据库
        if: always()
        uses: actions/cache/save@v4
        with:
          path: flights.db
          key: flightdb-${{ github.run_id }}

      - name: 生成报告
        if: steps.scan.outputs.persist == 'yes'
        run: python -m flightwatch report --html docs/index.html

      # 历史 CSV 每轮都提交：纯文本追加，git 增量压缩有效，
      # 且按天分文件 —— 昨天的文件写完即不再变动。
      # 数据库（二进制）只在发了消息的轮次提交，否则仓库会被撑爆。
      - name: 提交数据
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if [ "${{ steps.scan.outputs.persist }}" = "yes" ]; then
            git add flights.db docs/index.html
          fi
          git diff --staged --quiet && exit 0
          git commit -m "flightwatch: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
