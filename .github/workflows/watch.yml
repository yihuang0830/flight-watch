name: Flight Watch

on:
  schedule:
    # 每天 UTC 02:00 / 14:00 跑两轮。机票价格变动没那么快，抓太勤只会增加被限流的风险。
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 需要把 flights.db 提交回仓库来保存历史

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 抓取
        run: python -m flightwatch watch

      - name: 生成报告
        if: always()        # 抓取失败也要出报告，报告里会显示失败告警
        run: python -m flightwatch report --html docs/index.html

      - name: 提交历史数据
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights.db docs/index.html
          git diff --staged --quiet || git commit -m "flightwatch: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
